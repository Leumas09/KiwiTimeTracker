name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:sql
      - run: npm run build

  e2e:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Postgres + PostgREST
        run: PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1) scripts/integration-env.sh start
      - run: npm run test:integration
      - run: npx playwright test
        env:
          E2E_SUPABASE: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
